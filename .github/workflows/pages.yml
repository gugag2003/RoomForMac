name: Pages

# Deploys site/ to GitHub Pages when the site changes on the default branch, or on
# demand. release.yml's `pages` job stages and deploys the same site after each
# release. Every Pages deployment replaces the whole site, so this workflow stages
# it exactly as release.yml does, through scripts/stage-site.sh. The appcast is not
# part of the site: it is a release asset (Plan 6, Ruling 3).
on:
  push:
    # main-mrvlfl is the repository's default branch on GitHub; the job's `if`
    # deploys only from whichever branch is the default.
    branches: [main, main-mrvlfl]
    paths: ["site/**", "scripts/stage-site.sh", "Config/Distribution.xcconfig"]
  workflow_dispatch:

permissions: {}

defaults:
  run:
    shell: bash

jobs:
  deploy:
    name: Deploy the site
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # latest.json is the newest release's summary. It is not in git, so the site
      # is staged without it before the first release.
      - name: Fetch the published summary
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          mkdir -p "$RUNNER_TEMP/summary"
          tag="$(gh release list --exclude-drafts --exclude-pre-releases --limit 1 --json tagName --jq '.[0].tagName // empty')"
          if [[ -z "$tag" ]]; then
              echo "::notice::No release is published yet, so the site is staged without latest.json."
              exit 0
          fi
          gh release download "$tag" --pattern latest.json --dir "$RUNNER_TEMP/summary"

      # From 1.0.0 on, --strict-from-summary refuses "[OWNER:" placeholders (Ruling 12).
      - name: Stage the site
        run: |
          summary="$RUNNER_TEMP/summary/latest.json"
          if [[ -f "$summary" ]]; then
              scripts/stage-site.sh build/site "$summary" --strict-from-summary
          else
              scripts/stage-site.sh build/site
          fi

      - name: Upload the Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: build/site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
