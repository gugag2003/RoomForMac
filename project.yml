# XcodeGen 2.46 project definition; run `xcodegen generate` after any change.
# RoomForMac.xcodeproj, RoomForMac/Info.plist and RoomForMac/RoomForMac.entitlements
# are generated from this file and git-ignored.
#
# Both configurations use Config/App.xcconfig, which includes
# Config/Distribution.xcconfig (the distribution identifiers) and then
# Config/Signing.xcconfig. Signing lives only in Signing.xcconfig. Add no
# signing or team settings here, at project or target level: they would silently
# override that file and the per-developer Config/Local.xcconfig it includes.
name: RoomForMac
options:
  bundleIdPrefix: com.roomformac
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
  developmentLanguage: en
  # XcodeGen 2.46 writes an .icon bundle's file type as wrapper.icon, which Xcode's
  # build specifications do not define (theirs is folder.iconcomposer.icon), so
  # the generated project is corrected after every generation. A XcodeGen that
  # already writes the right type makes this a no-op.
  postGenCommand: perl -pi -e 's/lastKnownFileType = wrapper\.icon;/lastKnownFileType = folder.iconcomposer.icon;/' RoomForMac.xcodeproj/project.pbxproj

configFiles:
  Debug: Config/App.xcconfig
  Release: Config/App.xcconfig

settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEAD_CODE_STRIPPING: YES
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    SWIFT_EMIT_LOC_STRINGS: YES
    # Info.plist's RFMSkipQuarantineCleanup. Only the update rehearsal builds a
    # copy with YES; every release carries NO.
    RFM_SKIP_QUARANTINE_CLEANUP: NO

packages:
  MoleEngine:
    path: Packages/MoleEngine
  # The one third-party dependency. exactVersion is the pin: Swift Package
  # Manager checks the binary target's checksum against Sparkle's own manifest.
  # Only the app target links it.
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: 2.10.0

targets:
  RoomForMac:
    type: application
    platform: macOS
    deploymentTarget: "26.0"
    sources:
      - path: RoomForMac
        excludes:
          - Generated
          - Resources/Backgrounds
      # Written by the "Prepare engine" phase before compiling; git-ignored.
      - path: RoomForMac/Generated/EngineExpectation.swift
        optional: true
      - path: RoomForMac/Resources/Backgrounds
        type: folder
        buildPhase: resources
      # Legal documents for Settings → About. They stay at the repository root,
      # where GitHub and source archives expect them.
      - path: LICENSE
        buildPhase: resources
      - path: NOTICE
        buildPhase: resources
      - path: CREDITS.md
        buildPhase: resources
      # The license texts of bundled third-party code, copied as a folder:
      # Contents/Resources/ThirdParty/Sparkle/LICENSE, for Settings → About.
      - path: ThirdParty
        type: folder
        buildPhase: resources
    info:
      path: RoomForMac/Info.plist
      properties:
        CFBundleDisplayName: RoomForMac
        LSApplicationCategoryType: public.app-category.utilities
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSAppleEventsUsageDescription: RoomForMac asks Finder to move apps to the Trash if the usual way fails. It asks System Events which apps are running before a cleanup and to remove the login items of apps you uninstall.
        NSDownloadsFolderUsageDescription: RoomForMac looks for unfinished downloads it can clean up.
        NSDesktopFolderUsageDescription: RoomForMac measures what fills your Desktop.
        NSDocumentsFolderUsageDescription: RoomForMac measures what fills your Documents folder.
        NSRemovableVolumesUsageDescription: RoomForMac measures what fills your external drives.
        NSNetworkVolumesUsageDescription: RoomForMac measures what fills network drives you choose.
        CFBundleURLTypes:
          - CFBundleURLName: com.roomformac.RoomForMac
            CFBundleURLSchemes: [roomformac]
        # Distribution values from Config/Distribution.xcconfig. Sparkle's other
        # keys stay at its defaults and are never set here.
        SUFeedURL: $(RFM_FEED_URL)
        SUPublicEDKey: $(RFM_SPARKLE_PUBLIC_KEY)
        SUEnableAutomaticChecks: true
        RFMSiteURL: $(RFM_SITE_URL)
        # For update rehearsal V6 only; releases must carry NO.
        RFMSkipQuarantineCleanup: $(RFM_SKIP_QUARANTINE_CLEANUP)
    entitlements:
      path: RoomForMac/RoomForMac.entitlements
      # The two entitlements the hardened runtime (on in Release) needs, and no others:
      # Apple events for the Automation permission, and library validation off because
      # a self-signed certificate has no Team ID, so Sparkle.framework would not load.
      properties:
        com.apple.security.automation.apple-events: true
        com.apple.security.cs.disable-library-validation: true
    dependencies:
      - package: MoleEngine
        product: MoleEngine
      # No `embed: true`. Sparkle is a dynamic binary framework, so Xcode itself
      # embeds it in Contents/Frameworks and signs it. An explicit Embed Frameworks
      # entry makes Xcode 27 copy a second, nonexistent "Sparkle-product" and fail
      # the build. Prepare Sparkle then finishes the job.
      - package: Sparkle
        product: Sparkle
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.roomformac.RoomForMac
        PRODUCT_NAME: RoomForMac
        ARCHS: $(ARCHS_STANDARD)
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        # RoomForMac/Resources/AppIcon.icon: actool names the icon after the bundle,
        # and the built Info.plist's CFBundleIconName follows this setting.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Build scripts only: where build/engine lives. The app never reads it.
        RFM_ENGINE_DIR: $(SRCROOT)/build/engine
    preBuildScripts:
      # Rebuilds build/engine only when its inputs changed (~0.1 s otherwise),
      # then records the engine this build expects as Swift.
      - name: Prepare engine
        script: '"${SRCROOT}/scripts/ensure-engine.sh" && "${SRCROOT}/scripts/engine-expectation.sh"'
        shell: /bin/bash
        showEnvVars: false
        basedOnDependencyAnalysis: false
        outputFiles:
          - $(SRCROOT)/RoomForMac/Generated/EngineExpectation.swift
    postBuildScripts:
      # Copies build/engine into the app, moves the Go tools to Contents/Helpers
      # and signs them. Runs before Xcode signs the app.
      - name: Embed engine
        script: '"${SRCROOT}/scripts/embed-engine.sh"'
        shell: /bin/bash
        showEnvVars: false
        basedOnDependencyAnalysis: false
        outputFiles:
          - $(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/engine/VERSION
      # Deletes Sparkle's XPC services (they are for sandboxed apps) and signs its
      # nested code again with the identity Xcode signs the app with. Runs before
      # Xcode signs the app, and after Xcode has copied and signed Sparkle.framework
      # itself: that copy is not part of a build phase, so only the two declared
      # inputs (files its Copy and CodeSign produce) order this phase after it;
      # without them the copy can land after the phase and undo it. The output is
      # the file the script touches after signing.
      - name: Prepare Sparkle
        script: '"${SRCROOT}/scripts/prepare-sparkle.sh"'
        shell: /bin/bash
        showEnvVars: false
        basedOnDependencyAnalysis: false
        inputFiles:
          - $(TARGET_BUILD_DIR)/$(FRAMEWORKS_FOLDER_PATH)/Sparkle.framework/Versions/B/Sparkle
          - $(TARGET_BUILD_DIR)/$(FRAMEWORKS_FOLDER_PATH)/Sparkle.framework/Versions/B/_CodeSignature
        outputFiles:
          - $(TARGET_BUILD_DIR)/$(FRAMEWORKS_FOLDER_PATH)/Sparkle.framework/Versions/B/Autoupdate
    scheme:
      testTargets:
        - RoomForMacTests
        - RoomForMacUITests
      gatherCoverageData: false

  RoomForMacTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "26.0"
    sources:
      - path: RoomForMacTests
    dependencies:
      - target: RoomForMac
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.roomformac.RoomForMac.tests
        GENERATE_INFOPLIST_FILE: YES

  RoomForMacUITests:
    type: bundle.ui-testing
    platform: macOS
    deploymentTarget: "26.0"
    sources:
      - path: RoomForMacUITests
    dependencies:
      - target: RoomForMac
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.roomformac.RoomForMac.uitests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  RoomForMacUnit:
    build:
      targets:
        RoomForMac: all
        RoomForMacTests: [test]
    test:
      config: Debug
      gatherCoverageData: false
      targets:
        - name: RoomForMacTests
          parallelizable: false
